name: Build-VST

on: [push, workflow_dispatch]

jobs:
  runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Faust
        shell: pwsh
        run: choco install faust -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Generate CPP
        shell: cmd
        run: faust -a vst.cpp VintageWinter.dsp -o VintageWinter.cpp

      - name: Compile DLL
        shell: cmd
        run: cl /O2 /LD /EHsc VintageWinter.cpp /FeVintageWinter.dll

      - name: Upload Artifact
        with:
          name: Vintage-Winter-Plugin
          path: VintageWinter.dll
